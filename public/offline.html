<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You are offline</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6fb; color: #0b1b33; display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
    main { max-width: 360px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #52607a; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Fees, results and messages need the internet. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
